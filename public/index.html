<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONCLOVIA BEATS</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px;margin:0}
h1{letter-spacing:4px}
.beat{background:#151515;padding:15px;margin:15px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center}
button{background:#fff;color:#000;border:none;padding:8px 15px;border-radius:5px;cursor:pointer;font-weight:bold}
button.delete{background:#ff2a2a;color:#fff}
#loginModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);justify-content:center;align-items:center}
.modal-box{background:#1a1a1a;padding:30px;border-radius:10px;width:300px}
input{width:100%;padding:10px;margin:10px 0;background:#000;color:#fff;border:1px solid #333;border-radius:5px;box-sizing:border-box}
#uploadArea{display:none;margin:20px 0;padding:20px;background:#151515;border-radius:10px}
</style>
</head>
<body>
<div style="display:flex;justify-content:space-between">
<h1>MONCLOVIA BEATS</h1>
<div>
<button id="btnLogin" onclick="document.getElementById('loginModal').style.display='flex'">Admin Login</button>
<button id="btnLogout" style="display:none" onclick="logout()">Salir</button>
</div>
</div>

<div id="uploadArea">
<h3>Subir nuevo beat</h3>
<input type="text" id="beatTitle" placeholder="Nombre del beat">
<input type="file" id="beatFile" accept="audio/*">
<button onclick="uploadBeat()">Subir Beat</button>
</div>

<div id="beatsList">Cargando beats...</div>

<div id="loginModal">
<div class="modal-box">
<h3>Admin</h3>
<input id="adminUser" placeholder="Usuario">
<input id="adminPass" type="password" placeholder="Contraseña">
<button onclick="login()" style="width:100%">Entrar</button>
<button onclick="document.getElementById('loginModal').style.display='none'" style="width:100%;margin-top:10px;background:#333;color:#fff">Cancelar</button>
</div>
</div>

<script>
let isAdmin = localStorage.getItem('isAdmin') === 'true';
function updateUI(){
  if(isAdmin){
    document.getElementById('btnLogin').style.display='none';
    document.getElementById('btnLogout').style.display='inline-block';
    document.getElementById('uploadArea').style.display='block';
  }
}
updateUI();

async function login(){
  const user = document.getElementById('adminUser').value.trim();
  const pass = document.getElementById('adminPass').value.trim();
  try{
    const res = await fetch('/api/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({user, pass})
    });
    const data = await res.json();
    if(data.ok){
      localStorage.setItem('isAdmin','true');
      isAdmin=true;
      document.getElementById('loginModal').style.display='none';
      updateUI();
      loadBeats();
    } else {
      alert('Usuario o contraseña incorrectos');
    }
  }catch(e){ alert('Error de conexión'); }
}

function logout(){
  localStorage.removeItem('isAdmin');
  isAdmin=false;
  location.reload();
}

async function loadBeats(){
  const res = await fetch('/api/beats');
  const beats = await res.json();
  const list = document.getElementById('beatsList');
  if(beats.length===0){ list.innerHTML='No hay beats aún'; return; }
  list.innerHTML='';
  beats.forEach((b,i)=>{
    const div = document.createElement('div');
    div.className='beat';
    div.innerHTML = `
      <div>
        <b>${b.title}</b><br>
        <audio controls src="${b.url}" style="margin-top:5px"></audio>
      </div>
      <div>${isAdmin? `<button class="delete" onclick="deleteBeat(${i})">🗑️ Borrar</button>` : ''}</div>
    `;
    list.appendChild(div);
  });
}

async function uploadBeat(){
  const title = document.getElementById('beatTitle').value;
  const file = document.getElementById('beatFile').files[0];
  if(!file){ alert('Selecciona un archivo'); return; }
  const fd = new FormData();
  fd.append('beat', file);
  fd.append('title', title || file.name);
  const res = await fetch('/api/upload', {method:'POST', body: fd});
  const data = await res.json();
  if(data.ok){
    alert('Beat subido');
    document.getElementById('beatTitle').value='';
    document.getElementById('beatFile').value='';
    loadBeats();
  } else { alert('Error al subir'); }
}

async function deleteBeat(i){
  if(!confirm('¿Borrar este beat?')) return;
  await fetch('/api/beats/'+i, {method:'DELETE'});
  loadBeats();
}

loadBeats();
</script>
</body>
</html>
