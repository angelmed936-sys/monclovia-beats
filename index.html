<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monclova Beats</title><style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;margin:0;padding:20px}h1{color:#ff0055;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1000px;margin:auto}.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:15px}audio{width:100%;margin:10px 0}button{padding:10px;border-radius:8px;width:100%;cursor:pointer;font-weight:700;border:0;margin-top:5px}.buy{background:#ff0055;color:#fff}.del{background:#222;color:#ff4444;border:1px solid #ff444422}</style></head><body><h1>🎧 MONCLOVA BEATS</h1><div class="grid" id="tienda"></div><script>async function cargar(){let r=await fetch('/api/beats');let beats=await r.json();document.getElementById('tienda').innerHTML=beats.map(b=>`<div class="card"><h3>${b.Nombre}</h3><p>${b.BPM} BPM - $${b.Precio} MXN</p><audio controls src="${b.Audio}"></audio><button class="buy" onclick="alert('Comprar ${b.Nombre}')">COMPRAR</button><button class="del" onclick="borrar(${b.ID})">🗑️ BORRAR</button></div>`).join('')}async function borrar(id){if(!confirm('¿Borrar este beat?'))return;await fetch('/api/beats/'+id,{method:'DELETE'});cargar()}cargar()</script></body></html>
