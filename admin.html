<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><style>body{background:#0a0a0a;color:#fff;font-family:sans-serif;max-width:500px;margin:auto;padding:20px}input{width:100%;padding:12px;margin:8px 0;background:#1a1a1a;border:1px solid #333;color:#fff;border-radius:8px}button{background:#ff0055;color:#fff;border:0;padding:12px;border-radius:8px;width:100%;font-weight:700;cursor:pointer}h1{color:#ff0055}</style></head><body><h1>Subir Beat</h1><input id="nombre" placeholder="Nombre"><input id="bpm" type="number" placeholder="BPM"><input id="precio" type="number" placeholder="Precio"><input id="file" type="file" accept="audio/*"><button onclick="subir()">SUBIR</button><p id="status"></p><a href="/" style="color:#888">← Ver tienda</a><script>async function subir(){const f=document.getElementById('file').files[0];if(!f)return alert('elige mp3');document.getElementById('status').innerText='Subiendo...';let fd=new FormData();fd.append('audio',f);let r=await fetch('/api/upload',{method:'POST',body:fd});let d=await r.json();let beat={Nombre:document.getElementById('nombre').value,BPM:parseInt(document.getElementById('bpm').value),Precio:parseInt(document.getElementById('precio').value),Audio:d.url};await fetch('/api/beats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(beat)});document.getElementById('status').innerText='✅ Subido! Ve a la tienda.'}</script></body></html>
